[test]

coverage = true

coverageSkipTestFiles = true

coveragePathIgnorePatterns = ["test/utils/*.ts", "dist/**/*.js", "dist/**/*.ts", "../**/*.ts", "../**/*.js"]

[test.reporter]
junit = "junit.xml"

[fmt]
printWidth = 120
singleQuote = true
ignorePatterns = [
  ".changeset/",
  ".claude/",
  ".github/",
  "*.md",
  "*.log",
  "bun.lockb",
  "package-lock.json",
  "yarn.lock",
  "pnpm-lock.yaml",
]
